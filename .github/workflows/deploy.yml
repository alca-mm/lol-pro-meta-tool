name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Every action referenced directly below already declares the node24
      # runtime. actions/upload-pages-artifact@v4 is a composite action that
      # internally pins actions/upload-artifact@v4.6.2, which still declares
      # node20 - this flag forces that transitive action onto Node 24 and
      # keeps the "Node.js 20 is deprecated" warnings out of the log.
      # Remove only if an action misbehaves. Never set
      # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # .nvmrc is the single source of truth for the Node version - local
      # development (nvm use) and CI therefore cannot drift apart.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unpack last-known-good data
        run: |
          mkdir -p public/data
          if [ -f "public/data/importedMatches.json.gz" ]; then
            gzip -dkf public/data/importedMatches.json.gz
            echo "✓ importedMatches.json.gz entpackt als Fallback"
          else
            echo "ℹ Kein importedMatches.json.gz im Repo gefunden"
          fi

      - name: Restore last deployed data
        run: |
          mkdir -p public/data
          curl -L -f "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/importedMatches.json" -o public/data/importedMatches.json || echo "No deployed importedMatches.json found — starting fresh"
          curl -L -f "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest-sync-report.json" -o public/data/latest-sync-report.json || echo "No deployed latest-sync-report.json found — starting fresh"

      - name: Sync pro play data
        run: npm run sync:data
        continue-on-error: true

      - name: Run tests
        run: npm test

      # Cheap and fast, so it runs before the expensive build and fails first.
      # npm run build is "tsc && vite build" with include: ["src"], so it never
      # typechecks scripts/ - including scripts/checkDistForCustomDomain.ts,
      # the custom-domain guard this workflow itself invokes further below.
      - name: Typecheck tooling scripts
        run: npm run typecheck:tools

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Build
        run: npm run build
        env:
          # Custom domain at root (aatroxtool.de) → build with base '/'.
          # src/lib/normalizeBasePath.ts already maps an unset VITE_BASE_PATH
          # to '/', so we deliberately do NOT set it here.
          # Do NOT set VITE_BASE_PATH=/lol-pro-meta-tool/ — a repo subpath
          # would break every asset URL on the custom domain. That value only
          # applies to a github.io project site, which this deployment is not.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Verify dist for custom domain
        run: npm run check:dist

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5