name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Force first-party JS actions onto the Node 24 runtime to clear the
      # "Node.js 20 is deprecated" Actions warnings. Remove if any action misbehaves.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unpack last-known-good data
        run: |
          mkdir -p public/data
          if [ -f "public/data/importedMatches.json.gz" ]; then
            gzip -dkf public/data/importedMatches.json.gz
            echo "✓ importedMatches.json.gz entpackt als Fallback"
          else
            echo "ℹ Kein importedMatches.json.gz im Repo gefunden"
          fi

      - name: Restore last deployed data
        run: |
          mkdir -p public/data
          curl -L -f "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/importedMatches.json" -o public/data/importedMatches.json || echo "No deployed importedMatches.json found — starting fresh"
          curl -L -f "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest-sync-report.json" -o public/data/latest-sync-report.json || echo "No deployed latest-sync-report.json found — starting fresh"

      - name: Sync pro play data
        run: npm run sync:data
        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Custom domain at root (aatroxtool.de) → build with base '/'.
          # vite.config.ts defaults to '/' when VITE_BASE_PATH is unset, so we
          # deliberately do NOT set it here. Do NOT set VITE_BASE_PATH=/ — the
          # config normalizes a bare '/' to '//' (broken). For a GitHub Pages
          # project subpath instead, set VITE_BASE_PATH=/<repo-name>/.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4