name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore last deployed data
        run: |
          mkdir -p public/data
          curl -L -f "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/importedMatches.json" -o public/data/importedMatches.json || echo "No deployed importedMatches.json found — starting fresh"
          curl -L -f "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest-sync-report.json" -o public/data/latest-sync-report.json || echo "No deployed latest-sync-report.json found — starting fresh"

      - name: Sync pro play data
        run: npm run sync:data
        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4